<div class="field" [class.invalid]="touched && errorMessage">
  <label class="field__label">{{ label }}</label>

  <input class="field__input" [type]="type" [placeholder]="placeholder" [value]="value" (blur)="onBlur()" />

  <p class="field__error" [hidden]="!(touched && errorMessage)">{{ errorMessage }}</p>
</div>
