<div class="chip-row">
  <button
    class="chip"
    type="button"
    [class.active]="isActive('beginner')"
    (click)="onSelect('beginner')"
  >
    Principiante
  </button>
  <button
    class="chip"
    type="button"
    [class.active]="isActive('intermediate')"
    (click)="onSelect('intermediate')"
  >
    Intermedio
  </button>
  <button
    class="chip"
    type="button"
    [class.active]="isActive('advanced')"
    (click)="onSelect('advanced')"
  >
    Avanzado
  </button>
</div>
