<div class="overlay">
  <!--
    *ngFor renders one dot per keypoint.
    Each [style.*] below is a property binding: the dot's position and
    color follow whatever the parent passes in via [keypoints].
  -->
  <span
    class="dot"
    *ngFor="let kp of keypoints"
    [style.left.%]="kp.xPercent"
    [style.top.%]="kp.yPercent"
    [style.background]="dotColor(kp)"
    [title]="kp.name"
  ></span>
</div>
