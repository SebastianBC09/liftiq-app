<div class="field" [class.invalid]="touched && errorMessage">
  <label class="field__label">{{ label }}</label>

  <div class="field__row">
    <!-- [type] is a property binding: toggling `visible` flips text <-> password -->
    <input
      class="field__input"
      [type]="visible ? 'text' : 'password'"
      [placeholder]="placeholder"
      [value]="value"
      (input)="onInput($any($event.target).value)"
      (blur)="onBlur()"
    />
    <!-- (click) event binding toggling local component state -->
    <button class="field__toggle" type="button" (click)="toggleVisibility()">
      {{ visible ? 'Ocultar' : 'Mostrar' }}
    </button>
  </div>

  <!-- *ngIf: strength meter only rendered on the register screen -->
  <div class="field__strength" *ngIf="showStrength && value">
    <div class="field__strength-track">
      <div
        class="field__strength-fill"
        [style.width.%]="(strengthScore + 1) * 25"
        [style.background]="strengthColor"
      ></div>
    </div>
    <span class="field__strength-label" [style.color]="strengthColor">{{ strengthLabel }}</span>
  </div>

  <p class="field__error" *ngIf="touched && errorMessage">{{ errorMessage }}</p>
</div>
