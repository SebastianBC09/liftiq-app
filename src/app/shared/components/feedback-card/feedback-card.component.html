<div class="feedback" [hidden]="dismissed" [class.warn]="severity === 'warn'" [class.error]="severity === 'error'"
  [class.good]="severity === 'good'">
  <span class="feedback__message">{{ message }}</span>
  <button class="feedback__close" type="button" (click)="onDismiss()" aria-label="Cerrar">×</button>
</div>
