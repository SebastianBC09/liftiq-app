<ion-content [fullscreen]="true">
  <div class="header">
    <h1 class="liq-text-title-1">Explorar</h1>
    <p class="liq-text-caption">3 ejercicios · 7 grupos</p>
  </div>

  <ion-searchbar placeholder="Buscar ejercicio..." [(ngModel)]="searchTerm" name="searchTerm"></ion-searchbar>

  <div class="chip-wrap">
    <chip-select></chip-select>
  </div>

  <div class="cards">
    <div class="ex-card" (click)="openDetail('squat')">
      <div class="ex-info">
        <p class="ex-name">{{ squatName }}</p>
        <p class="ex-sub">{{ squatGroup }}</p>
      </div>
      <span class="ex-fav" [class.on]="squatFav" (click)="toggleSquatFav($event)">♥</span>
    </div>

    <div class="ex-card" (click)="openDetail('deadlift')">
      <div class="ex-info">
        <p class="ex-name">{{ deadliftName }}</p>
        <p class="ex-sub">{{ deadliftGroup }}</p>
      </div>
      <span class="ex-fav" [class.on]="deadliftFav" (click)="toggleDeadliftFav($event)">♥</span>
    </div>

    <div class="ex-card" (click)="openDetail('bench-press')">
      <div class="ex-info">
        <p class="ex-name">{{ benchName }}</p>
        <p class="ex-sub">{{ benchGroup }}</p>
      </div>
      <span class="ex-fav" [class.on]="benchFav" (click)="toggleBenchFav($event)">♥</span>
    </div>
  </div>
</ion-content>
