<ion-content [fullscreen]="true" class="ion-padding">
  <auth-header></auth-header>

  <step-indicator></step-indicator>

  <!-- Step 1: both steps stay in the DOM; [hidden] toggles which one shows. -->
  <form [hidden]="currentStep !== 1">
    <text-field></text-field>
    <password-field></password-field>

    <primary-button></primary-button>
    <button class="btn-back" type="button" (click)="goToStep2()">Siguiente</button>
  </form>

  <!-- Step 2 -->
  <form [hidden]="currentStep !== 2">
    <div class="field">
      <label class="field__label">Altura (cm)</label>
      <input class="field__input" type="number" placeholder="175" [(heightCm)]="heightCm" name="heightCm" />
    </div>

    <div class="field">
      <label class="field__label">Peso (kg)</label>
      <input class="field__input" type="number" placeholder="70" [(weightKg)]="weightKg" name="weightKg" />
    </div>

    <!-- Live BMI: recomputed on every input via the bmi / bmiColor getters. -->
    <div class="bmi-preview" [hidden]="bmi === null">
      <span class="bmi-preview__label">IMC estimado</span>
      <span class="bmi-preview__value" [style.color]="bmiColor">{{ bmi | number: '1.1-1' }}</span>
    </div>

    <p class="section-label">Nivel de experiencia</p>
    <chip-select></chip-select>

    <div class="step-actions">
      <button class="btn-back" type="button" (click)="goToStep1()">Atrás</button>
      <button class="btn" type="button" [disabled]="submitting" [class.loading]="submitting" (click)="onSubmit()">
        {{ submitting ? 'Creando…' : 'Crear cuenta' }}
      </button>
    </div>
  </form>

  <p class="switch-auth" [hidden]="currentStep !== 1">
    ¿Ya tienes cuenta?
    <a routerLink="/auth/login">Inicia sesión</a>
  </p>
</ion-content>
