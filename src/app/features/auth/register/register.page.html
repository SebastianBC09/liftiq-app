<ion-content [fullscreen]="true" class="ion-padding">
  <app-auth-header title="Crea tu cuenta" subtitle="Empecemos con lo básico"></app-auth-header>

  <!-- Property binding: currentStep/totalSteps drive which dots are lit -->
  <app-step-indicator [currentStep]="currentStep" [totalSteps]="totalSteps"></app-step-indicator>

  <!-- *ngIf switches between step 1 and step 2 while `this` keeps all state,
       so going back to step 1 doesn't lose anything already typed. -->
  <form *ngIf="currentStep === 1">
    <app-text-field
      label="Nombre"
      placeholder="Tu nombre"
      [(value)]="name"
      [touched]="nameTouched"
      [errorMessage]="!name ? 'El nombre es obligatorio' : ''"
      (fieldBlur)="nameTouched = true"
    ></app-text-field>

    <app-text-field
      label="Correo electrónico"
      type="email"
      placeholder="tu@correo.com"
      [(value)]="email"
      [touched]="emailTouched"
      [errorMessage]="emailError"
      (fieldBlur)="emailTouched = true"
    ></app-text-field>

    <app-password-field
      label="Contraseña"
      [showStrength]="true"
      [(value)]="password"
      [touched]="passwordTouched"
      [errorMessage]="passwordError"
      (fieldBlur)="passwordTouched = true"
    ></app-password-field>

    <app-password-field
      label="Confirmar contraseña"
      [(value)]="confirmPassword"
      [touched]="confirmTouched"
      [errorMessage]="confirmError"
      (fieldBlur)="confirmTouched = true"
    ></app-password-field>

    <app-primary-button label="Siguiente" (pressed)="goToStep2()"></app-primary-button>
  </form>

  <form *ngIf="currentStep === 2">
    <app-text-field
      label="Altura (cm)"
      type="number"
      placeholder="175"
      [value]="heightCm === null ? '' : heightCm.toString()"
      (valueChange)="heightCm = $event === '' ? null : +$event"
    ></app-text-field>

    <app-text-field
      label="Peso (kg)"
      type="number"
      placeholder="70"
      [value]="weightKg === null ? '' : weightKg.toString()"
      (valueChange)="weightKg = $event === '' ? null : +$event"
    ></app-text-field>

    <!-- Live BMI: recalculated on every input via the bmi/bmiColor getters -->
    <div class="bmi-preview" *ngIf="bmi !== null">
      <span class="bmi-preview__label">IMC estimado</span>
      <span class="bmi-preview__value" [style.color]="bmiColor">{{ bmi | number: '1.1-1' }}</span>
    </div>

    <p class="section-label">Nivel de experiencia</p>
    <!-- [(selected)] two-way binding on the generic chip-select -->
    <app-chip-select
      [options]="experienceOptions"
      [(selected)]="experienceLevel"
    ></app-chip-select>

    <div class="step-actions">
      <button class="btn-back" type="button" (click)="goToStep1()">Atrás</button>
      <app-primary-button
        label="Crear cuenta"
        [disabled]="step2Invalid"
        [loading]="submitting"
        (pressed)="onSubmit()"
      ></app-primary-button>
    </div>
  </form>

  <p class="switch-auth" *ngIf="currentStep === 1">
    ¿Ya tienes cuenta?
    <a routerLink="/auth/login">Inicia sesión</a>
  </p>
</ion-content>
