server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular router uses HTML5 pushState (see src/app/app.routes.ts) —
    # any unmatched path falls back to index.html so deep links
    # (e.g. /exercises/squat) work on a full page reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets; outputHashing: "all" in angular.json
    # (production configuration) means these filenames change on every
    # release, so a long cache is safe.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(?:js|css)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
